name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: >
          dotnet publish src/PrismOS -c Release -o publish
          /p:PublishSingleFile=true /p:SelfContained=false /p:DebugType=embedded

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Compress-Archive -Path publish/* -DestinationPath "prismos-$tag-win-x64.zip"
          Get-FileHash "prismos-$tag-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  prismos-$tag-win-x64.zip" } |
            Out-File "prismos-$tag-win-x64.zip.sha256" -Encoding ascii

      # Per-user Setup.exe (Velopack); it installs .NET 10 first when missing, which asks for admin.
      # The fixed name lets the site link releases/latest/download/PrismOS-Setup.exe. The id is
      # not "PrismOS": %LOCALAPPDATA%\PrismOS holds the log, and Velopack offers to wipe a
      # folder that isn't empty. No Velopack shortcuts: the app keeps its own Start menu entry.
      - name: Installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          dotnet tool install vpk --version 1.2.161 --tool-path .tools
          .tools/vpk pack --packId PrismOSApp --packTitle PrismOS --packAuthors "PrismOS" `
            --packVersion $tag.TrimStart('v') --packDir publish --mainExe prismos.exe `
            --icon src/PrismOS/prismos.ico --framework net10.0-x64-desktop --runtime win-x64 `
            --shortcuts "" -o velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item velopack/PrismOSApp-win-Setup.exe PrismOS-Setup.exe
          Get-FileHash PrismOS-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  PrismOS-Setup.exe" } |
            Out-File PrismOS-Setup.exe.sha256 -Encoding ascii

      # The softprops draft step used to die with "Too many retries" and leave the assets
      # nowhere, so every release was packaged and uploaded by hand. gh is preinstalled on the
      # runner and publishes straight from the built files; the Velopack feed goes up too so a
      # future in-app update check has something to read.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $files = @(
            "prismos-$tag-win-x64.zip", "prismos-$tag-win-x64.zip.sha256",
            "PrismOS-Setup.exe", "PrismOS-Setup.exe.sha256",
            "velopack/RELEASES", "velopack/releases.win.json", "velopack/assets.win.json"
          )
          $files += (Get-ChildItem velopack/*-full.nupkg | Select-Object -First 1).FullName
          $notes = @'
          `PrismOS-Setup.exe` installs PrismOS for your user, and the .NET 10 desktop runtime too if it is missing. The zip needs the [.NET 10 desktop runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed already.

          Releases are **unsigned**, so SmartScreen will warn. Verify the SHA-256 against the
          `.sha256` file, or build from source.
          '@
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "PrismOS $($tag.TrimStart('v'))" --notes-file notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
