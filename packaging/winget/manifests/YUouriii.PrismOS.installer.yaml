InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: prismos.exe
    PortableCommandAlias: prismos
UpgradeBehavior: install
ReleaseDate: 2026-11-12
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/YUouriii/PrismOS/releases/download/v0.3.2/prismos-v0.3.2-win-x64.zip
    # TODO(release): replace with the SHA-256 from this fork's own
    # prismos-<tag>-win-x64.zip.sha256 asset. The upstream FeatherWall value is not valid here,
